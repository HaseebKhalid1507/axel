# A connection's busy handler is set by `axel::busy` only: these replace it and leave the
# wait `busy::get` reports. Tests that mean SQLite's own timeout say `#[allow]`.
disallowed-methods = [
    { path = "rusqlite::Connection::busy_timeout", reason = "use axel::busy::set (a wait on the wall clock)" },
    { path = "rusqlite::Connection::busy_handler", reason = "use axel::busy::set (a wait on the wall clock)" },
]
